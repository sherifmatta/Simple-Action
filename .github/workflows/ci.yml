# The gate the epic context asks for: "the suite must pass in CI against the
# same commit that deploys." This runs the same four commands a developer runs
# locally, in the same order, against the checked-out commit — so a green run
# here and a green run there mean the same thing.
#
# Vercel deploys only after the `verify` job passes on the commit it builds:
# `vercel.json`'s `ignoreCommand` runs `scripts/wait-for-ci.mjs`, which waits
# for this job by name. Renaming the job means updating `CHECK_NAME` there.
#
# `DATABASE_URL` must point at a Neon **branch**, never at production. The
# repository tests write rows and the end-to-end suite creates Todos through
# the UI; both are harmless against a branch and are not something to run
# against the database a real deployment reads. Create a dedicated CI branch in
# Neon and put its pooled connection string in the repository secret.
name: CI

on:
  push:
  pull_request:

# Nothing in this workflow writes to the repository, so the token it runs with
# should not be able to. Without this key the job inherits the repository
# default, which on repositories created before GitHub's 2023 change is read
# *and write* to `contents` — and `vercel.json` builds from this repository, so
# a write token is a path to production for anything that runs in the job.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # `.nvmrc` is the single Node pin; repeating the major here would be
          # the second place it could drift.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium only, for the reason `playwright.config.ts` records: the
      # Client Identity cookie is `Secure`, and Chromium is the engine that
      # keeps a Secure cookie delivered over `http://localhost`.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test
        env:
          # Scoped to the two steps that read it, not the job. At job level it
          # would also be in the environment of `npm ci`, whose install
          # lifecycle scripts run code from every package in the tree — a live
          # Neon credential present during install for no reason. Nothing in
          # the codebase defaults it, so an unset secret still fails loudly at
          # module load rather than quietly skipping a test.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # `playwright.config.ts` starts the server itself with
      # `npm run build && npm start`, so the end-to-end suite runs against a
      # production build of this commit.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          # Scoped to the two steps that read it, not the job. At job level it
          # would also be in the environment of `npm ci`, whose install
          # lifecycle scripts run code from every package in the tree — a live
          # Neon credential present during install for no reason. Nothing in
          # the codebase defaults it, so an unset secret still fails loudly at
          # module load rather than quietly skipping a test.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
